# Builds the node image on GitHub's servers from this repository and publishes it to GitHub Container Registry,
# with a signed record of which commit and workflow produced it. Runs on version tags, or by hand.
name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/bytecoinbcn-community/bytecoin
  LMDB_COMMIT: f334f6a4a5c00b873f5721b8265d102c6b6b3667

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: bytecoin
      - uses: actions/checkout@v4
        with:
          repository: bcndev/lmdb
          ref: ${{ env.LMDB_COMMIT }}
          path: lmdb
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bytecoin/docker/Dockerfile
          build-args: JOBS=4
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary
        run: |
          echo "Image: ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
